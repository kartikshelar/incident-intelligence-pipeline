services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incident_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/incident_intel
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/incident_intel
      # M4 review routing (ADR-010): read by POST /review/route and shown
      # by the queue. Same values as the worker's, from ./.env or the shell.
      APP_REVIEW_CONFIDENCE_FLOOR: ${APP_REVIEW_CONFIDENCE_FLOOR:-0.70}
      APP_REVIEW_BUDGET: ${APP_REVIEW_BUDGET:-}
      # M6 tracing (app/telemetry/tracing.py): console by default, so
      # `docker compose up` needs no collector. Set APP_OTEL_EXPORTER=otlp
      # and APP_OTEL_EXPORTER_ENDPOINT to send elsewhere.
      APP_OTEL_EXPORTER: ${APP_OTEL_EXPORTER:-console}
      APP_OTEL_EXPORTER_ENDPOINT: ${APP_OTEL_EXPORTER_ENDPOINT:-}
      APP_OTEL_SERVICE_NAME: incident-intel-api
      # M6 cost per document (app/telemetry/cost.py), same PRICE_* env vars
      # scripts/extraction_run.py already reads; unset means /metrics and
      # /cost report cost as null rather than a guess.
      PRICE_INPUT_USD_PER_MTOK: ${PRICE_INPUT_USD_PER_MTOK:-}
      PRICE_OUTPUT_USD_PER_MTOK: ${PRICE_OUTPUT_USD_PER_MTOK:-}
      PRICE_CACHE_READ_USD_PER_MTOK: ${PRICE_CACHE_READ_USD_PER_MTOK:-}
      PRICE_CACHE_WRITE_USD_PER_MTOK: ${PRICE_CACHE_WRITE_USD_PER_MTOK:-}
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/incident_intel
      # Extraction (M3) needs a provider, a model, and that provider's
      # key. Compose reads them from the shell or from ./.env (see
      # .env.example). Without them, ingest still works and each extract
      # job dead-letters with a recorded "not configured" error — see
      # README. The model and thinking defaults live here and in
      # .env.example, not in app code. `adaptive:low` since 2026-09-16
      # (runs 05-07; why: app/extract/schema.py changelog). `default`
      # sends no thinking parameter (the API's own default; see
      # app/extract/llm.py for the other values) — runs 01-04 and 07
      # were made this way.
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-anthropic}
      APP_EXTRACTION_MODEL: ${APP_EXTRACTION_MODEL:-claude-sonnet-5}
      APP_EXTRACTION_THINKING: ${APP_EXTRACTION_THINKING:-adaptive:low}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # M4 review routing (ADR-010): the worker runs a routing pass after
      # every completed extraction at this floor and budget. 0.70 is the
      # ADR's provisional operating point; M5 sweeps it (see .env.example).
      APP_REVIEW_CONFIDENCE_FLOOR: ${APP_REVIEW_CONFIDENCE_FLOOR:-0.70}
      APP_REVIEW_BUDGET: ${APP_REVIEW_BUDGET:-}
      # M6 tracing: same defaults as the api service, own service name so
      # spans from the two processes are distinguishable in a backend.
      APP_OTEL_EXPORTER: ${APP_OTEL_EXPORTER:-console}
      APP_OTEL_EXPORTER_ENDPOINT: ${APP_OTEL_EXPORTER_ENDPOINT:-}
      APP_OTEL_SERVICE_NAME: incident-intel-worker
      PRICE_INPUT_USD_PER_MTOK: ${PRICE_INPUT_USD_PER_MTOK:-}
      PRICE_OUTPUT_USD_PER_MTOK: ${PRICE_OUTPUT_USD_PER_MTOK:-}
      PRICE_CACHE_READ_USD_PER_MTOK: ${PRICE_CACHE_READ_USD_PER_MTOK:-}
      PRICE_CACHE_WRITE_USD_PER_MTOK: ${PRICE_CACHE_WRITE_USD_PER_MTOK:-}
    command: ["python", "-m", "app.worker.main"]

volumes:
  postgres_data:
